name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Type check + unit tests ───────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run unit tests
        run: bun test --coverage

      - name: Upload coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ─── Build smoke test (verify binary compiles) ────────────────────────────
  build-smoke:
    name: Build smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary (Linux x64)
        env:
          NODE_ENV: production
        run: bun build src/main.tsx --compile --target bun-linux-x64 --outfile dist/qiling-linux-x64

      - name: Smoke test binary
        run: ./dist/qiling-linux-x64 --version

      - name: Check binary size
        run: |
          SIZE=$(stat -c%s dist/qiling-linux-x64)
          echo "Binary size: ${SIZE} bytes ($(( SIZE / 1024 / 1024 )) MB)"
          # Fail if > 150MB (something went very wrong)
          [ "$SIZE" -lt 157286400 ] || (echo "Binary too large!" && exit 1)
