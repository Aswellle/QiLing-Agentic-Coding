name: Update Homebrew Formula

on:
  release:
    types: [published]

jobs:
  update-formula:
    name: Update scripts/homebrew/qiling.rb with release SHA256
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get release tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download release assets and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/v${VERSION}"

          download_sha256() {
            local filename="$1"
            local url="${BASE_URL}/${filename}"
            curl -fsSL "${url}" | sha256sum | awk '{print $1}'
          }

          MACOS_ARM64=$(download_sha256 "qiling-macos-arm64")
          MACOS_X64=$(download_sha256 "qiling-macos-x64")
          LINUX_ARM64=$(download_sha256 "qiling-linux-arm64")
          LINUX_X64=$(download_sha256 "qiling-linux-x64")

          echo "macos_arm64=${MACOS_ARM64}" >> $GITHUB_OUTPUT
          echo "macos_x64=${MACOS_X64}" >> $GITHUB_OUTPUT
          echo "linux_arm64=${LINUX_ARM64}" >> $GITHUB_OUTPUT
          echo "linux_x64=${LINUX_X64}" >> $GITHUB_OUTPUT

      - name: Update formula file
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          FORMULA="scripts/homebrew/qiling.rb"

          sed -i "s/version \".*\"/version \"${VERSION}\"/" "${FORMULA}"
          sed -i "s/PLACEHOLDER_MACOS_ARM64_SHA256/${{ steps.sha.outputs.macos_arm64 }}/" "${FORMULA}"
          sed -i "s/PLACEHOLDER_MACOS_X64_SHA256/${{ steps.sha.outputs.macos_x64 }}/" "${FORMULA}"
          sed -i "s/PLACEHOLDER_LINUX_ARM64_SHA256/${{ steps.sha.outputs.linux_arm64 }}/" "${FORMULA}"
          sed -i "s/PLACEHOLDER_LINUX_X64_SHA256/${{ steps.sha.outputs.linux_x64 }}/" "${FORMULA}"

          cat "${FORMULA}"

      - name: Commit updated formula
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/homebrew/qiling.rb
          git diff --staged --quiet || git commit -m "chore: update homebrew formula to v${{ steps.tag.outputs.version }}"
          git push
