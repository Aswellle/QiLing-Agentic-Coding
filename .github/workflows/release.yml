name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'     # e.g. v0.2.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # e.g. v0.2.0-beta.1

permissions:
  contents: write   # needed to create GitHub releases and upload assets

jobs:
  # ─── Run tests before release ─────────────────────────────────────────────
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # ─── Build all platform binaries (cross-compile from Ubuntu) ──────────────
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            artifact: qiling-linux-x64
            gzip: true
          - target: bun-linux-arm64
            artifact: qiling-linux-arm64
            gzip: true
          - target: bun-darwin-x64
            artifact: qiling-macos-x64
            gzip: true
          - target: bun-darwin-arm64
            artifact: qiling-macos-arm64
            gzip: true
          - target: bun-windows-x64
            artifact: qiling-windows-x64.exe
            gzip: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Inject version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/const VERSION = '.*'/const VERSION = '${VERSION}'/" src/main.tsx
          echo "Building version: ${VERSION}"

      - name: Build ${{ matrix.artifact }}
        env:
          NODE_ENV: production
        run: |
          bun build src/main.tsx \
            --compile \
            --target ${{ matrix.target }} \
            --outfile dist/${{ matrix.artifact }} \
            --minify

      - name: Compress (Unix binaries)
        if: matrix.gzip
        run: |
          cd dist
          gzip -k ${{ matrix.artifact }}
          echo "Compressed: $(ls -lh ${{ matrix.artifact }}.gz)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.gz

  # ─── Create GitHub Release ─────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for git log in changelog

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List built artifacts
        run: ls -lh dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum qiling-linux-x64 qiling-linux-arm64 \
                    qiling-macos-x64 qiling-macos-arm64 \
                    qiling-windows-x64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          echo "## QiLing (启灵) ${VERSION}" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "### 变更内容" >> release_notes.md
            git log --oneline "${PREV_TAG}..HEAD" --pretty="- %s" >> release_notes.md
          else
            echo "初始发布版本。" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "### 安装" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Linux / macOS:**" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo 'curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash' >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "**Windows (PowerShell):**" >> release_notes.md
          echo '```powershell' >> release_notes.md
          echo 'irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex' >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "**手动下载:** 从下方 Assets 下载对应平台的二进制文件。" >> release_notes.md

          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "QiLing ${{ github.ref_name }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/qiling-linux-x64
            dist/qiling-linux-x64.gz
            dist/qiling-linux-arm64
            dist/qiling-linux-arm64.gz
            dist/qiling-macos-x64
            dist/qiling-macos-x64.gz
            dist/qiling-macos-arm64
            dist/qiling-macos-arm64.gz
            dist/qiling-windows-x64.exe
            dist/SHA256SUMS.txt
